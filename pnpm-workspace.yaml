packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - bullmq@6.3.12

# Paquets autorisés à exécuter leurs scripts d'installation (Prisma, esbuild…)
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - msgpackr-extract
  - sharp
  - unrs-resolver
