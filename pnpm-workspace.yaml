packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  # Dépendances optionnelles de GramJS (ws) : modules natifs inutiles, scripts ignorés volontairement.
  bufferutil: false
  es5-ext: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - bullmq@6.3.12

# Paquets autorisés à exécuter leurs scripts d'installation (Prisma, esbuild…)
