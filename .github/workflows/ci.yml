name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verif:
    name: Lint, typage, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_SECRET: ci-secret
      IP_HASH_SALT: ci-salt
      TELEGRAM_WEBHOOK_SECRET: ci
      APP_BASE_URL: http://localhost:3000
      TRACKING_HOST: go.goolink.eu
      TRACKING_BASE_URL: https://go.goolink.eu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
