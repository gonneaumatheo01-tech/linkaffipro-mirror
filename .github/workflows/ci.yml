name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verif:
    name: Lint, typage, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # Base de test des tests d'intégration (garde-fou : le nom doit contenir « linkaffipro_test »).
          POSTGRES_DB: linkaffipro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linkaffipro_test
      REDIS_URL: redis://localhost:6379
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_SECRET: ci-secret
      IP_HASH_SALT: ci-salt
      TELEGRAM_WEBHOOK_SECRET: ci
      APP_BASE_URL: http://localhost:3000
      TRACKING_HOST: go.goolink.eu
      TRACKING_BASE_URL: https://go.goolink.eu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Tests d'intégration sur les services Postgres et Redis ci-dessus (sans Docker : CI=true est posé par GitHub).
      - run: pnpm test:integration --no-docker
      - run: pnpm build
