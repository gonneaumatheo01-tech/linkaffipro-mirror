name: Deploy to Railway

on:
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      - name: Link project
        run: railway link d0a46384-0c18-4cde-9ed8-2ce381fd3ed1 --environment production

      - name: Deploy web
        run: railway up --service web --detach

  deploy-worker:
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      - name: Link project
        run: railway link d0a46384-0c18-4cde-9ed8-2ce381fd3ed1 --environment production

      - name: Deploy worker
        run: railway up --service worker --detach
