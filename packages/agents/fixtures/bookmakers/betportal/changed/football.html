<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bet Portal — Football</title>
<style>body{font-family:sans-serif;margin:0;padding:12px}a{color:#036}[hidden]{display:none!important}section,article{margin:8px 0}</style></head>
<body>
<header class="bp-top"><a href="/" class="bp-brand">Bet Portal</a> <a href="/wallet" class="bp-wallet">Wallet</a></header>
<div id="cookie-banner" class="bp-cookies">Ce site utilise des cookies. <button id="cookie-ok" type="button">Accept all</button></div>
<nav class="bp-days"><a href="/football?day=2026-10-25">Today</a> <a href="/football?day=2026-10-26">Tomorrow</a></nav>
<form action="/search" method="get"><input type="search" name="q" placeholder="Search team"></form>
<h1>Football</h1><div id="list">Loading…</div>
<script>function sock(sub,onMsg){var s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/feed');s.onopen=function(){s.send(JSON.stringify(sub));};s.onmessage=function(e){onMsg(JSON.parse(e.data));};}
function hhmm(iso){var d=new Date(Date.parse(iso)+3600000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
var day=new URLSearchParams(location.search).get('day')||'2026-10-25';
sock({op:'sub',topic:'events',day:day},function(j){if(j.t==='error'||j.type==='error'){document.getElementById('list').textContent='Session expired';return;}if(!(j.type==='feed.events'))return;var items=j.payload.events.map(function(e){return {id:e.eventId,c:e.competitionName,h:e.participants.first,a:e.participants.second,ko:e.startsAt};});var by={};items.forEach(function(e){(by[e.c]=by[e.c]||[]).push(e);});var h='';Object.keys(by).forEach(function(c){h+='<h3 class="feed-comp">'+esc(c)+'</h3><ul>';by[c].forEach(function(e){h+='<li class="feed-item"><a href="/football/match/'+e.id+'"><b class="feed-item__first">'+esc(e.h)+'</b> v <b class="feed-item__second">'+esc(e.a)+'</b></a> <em class="feed-item__time" data-time="'+e.ko+'">'+hhmm(e.ko)+'</em></li>';});h+='</ul>';});document.getElementById('list').innerHTML=h;});</script>
<script>(function(){var b=document.getElementById('cookie-banner');if(!b)return;if(document.cookie.indexOf('consent=1')>=0){b.remove();return;}var o=document.getElementById('cookie-ok');if(o)o.addEventListener('click',function(){document.cookie='consent=1; path=/';b.remove();});})();</script>
</body></html>
