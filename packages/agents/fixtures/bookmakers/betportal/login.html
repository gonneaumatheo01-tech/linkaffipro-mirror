<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bet Portal — Log in</title>
<style>body{font-family:sans-serif;margin:0;padding:12px}a{color:#036}[hidden]{display:none!important}section,article{margin:8px 0}</style></head>
<body>
<h1>Your session has expired</h1><p>Please log in to continue.</p><form method="post" action="/login" class="login"><label>Email <input type="email" name="email" autocomplete="username"></label><label>Password <input type="password" name="password" autocomplete="current-password"></label><button type="submit" id="login-submit">Log in</button></form>

<script>(function(){var b=document.getElementById('cookie-banner');if(!b)return;if(document.cookie.indexOf('consent=1')>=0){b.remove();return;}var o=document.getElementById('cookie-ok');if(o)o.addEventListener('click',function(){document.cookie='consent=1; path=/';b.remove();});})();</script>
