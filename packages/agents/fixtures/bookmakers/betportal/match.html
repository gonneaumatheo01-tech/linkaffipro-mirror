<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bet Portal — Match</title>
<style>body{font-family:sans-serif;margin:0;padding:12px}a{color:#036}[hidden]{display:none!important}section,article{margin:8px 0}</style></head>
<body>
<header class="bp-top"><a href="/" class="bp-brand">Bet Portal</a> <a href="/wallet" class="bp-wallet">Wallet</a></header>
<div id="cookie-banner" class="bp-cookies">Ce site utilise des cookies. <button id="cookie-ok" type="button">Accept all</button></div>
<div id="match">Loading…</div>
<script>function sock(sub,onMsg){var s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/feed');s.onopen=function(){s.send(JSON.stringify(sub));};s.onmessage=function(e){onMsg(JSON.parse(e.data));};}
function hhmm(iso){var d=new Date(Date.parse(iso)+3600000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
var id=location.pathname.split('/').pop();window.betClicked=false;
sock({op:'sub',topic:'markets',eventId:id},function(j){if(!(j.t==='markets'))return;var ev=j.ev;var mk=j.mk;
var h='<h1 class="bp-title">'+esc(ev.h)+' v '+esc(ev.a)+'</h1><div class="bp-tabs"><button type="button" class="bp-tab" data-k="main">MAIN</button><button type="button" class="bp-tab" data-k="goals">GOALS</button><button type="button" class="bp-tab" data-k="crn">CRN</button><button type="button" class="bp-tab" data-k="bkg">BKG</button></div>';
mk.forEach(function(m){h+='<div class="bp-mkt" data-k="'+m.k+'"'+(m.k==='main'?'':' hidden')+'><div class="bp-mkt-h">'+esc(m.n)+'</div>';m.sel.forEach(function(s){h+='<div class="bp-row"><span class="bp-sel">'+esc(s.n)+'</span>'+(m.ln!=null?' <i class="bp-ln">'+m.ln.toFixed(1)+'</i>':'')+' <span class="bp-pr">'+esc(s.p)+'</span></div>';});h+='</div>';});
document.getElementById('match').innerHTML=h;
document.querySelectorAll('.bp-tab').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-k');document.querySelectorAll('div[data-k]').forEach(function(d){if(d.getAttribute('data-k')===k)d.removeAttribute('hidden');else d.setAttribute('hidden','');});});});
document.querySelectorAll('.bp-pr').forEach(function(b){b.addEventListener('click',function(){window.betClicked=true;});});});</script>
<script>(function(){var b=document.getElementById('cookie-banner');if(!b)return;if(document.cookie.indexOf('consent=1')>=0){b.remove();return;}var o=document.getElementById('cookie-ok');if(o)o.addEventListener('click',function(){document.cookie='consent=1; path=/';b.remove();});})();</script>
</body></html>
