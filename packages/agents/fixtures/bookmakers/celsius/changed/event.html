<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Celsius — Match</title><script src="https://sb2frontend-altenar2.biahosted.com/altenarWSDK.js" async></script>
<style>body{font-family:sans-serif;margin:0;padding:12px}a{color:#036}[hidden]{display:none!important}section,article{margin:8px 0}</style></head>
<body>
<header class="cs-top"><a href="/" class="cs-logo">Celsius</a> <span id="cs-balance"></span> <a href="/cashier/deposit" class="cs-deposit">Dépôt</a></header>
<div id="cookie-banner" class="cs-cookies">Ce site utilise des cookies. <button id="cookie-ok" type="button">Tout accepter</button></div>
<div id="event">Chargement…</div>
<script>function hhmm(iso){var d=new Date(Date.parse(iso)+3600000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderList(all){var by={};all.forEach(function(e){(by[e.league]=by[e.league]||[]).push(e);});var h='';Object.keys(by).forEach(function(l){h+='<section class="ev-comp"><h2 class="ev-comp__label">'+esc(l)+'</h2>';by[l].forEach(function(e){h+='<a class="ev-line" href="/sports/football/event/'+e.id+'"><span class="ev-line__p1">'+esc(e.home)+'</span> - <span class="ev-line__p2">'+esc(e.away)+'</span> <time class="ev-line__start" datetime="'+e.kickoff+'">'+hhmm(e.kickoff)+'</time> <span class="cs-more">+'+e.n+'</span></a>';});h+='</section>';});document.getElementById('events').innerHTML=h||'<p>Aucun match.</p>';}
window.__ready=async function(t){var id=location.pathname.split('/').pop();var r=await fetch('/api/v2/event/'+id+'/markets',{headers:{authorization:'Bearer '+t,accept:'application/json'}});var j=await r.json();var ev={home:j.ev.homeTeam.name,away:j.ev.awayTeam.name,league:j.ev.competition.title,kickoff:j.ev.startTime};var mk=j.groups.map(function(g){return {name:g.title,group:g.tab,line:g.handicap,sel:g.choices.map(function(o){return {label:o.name,price:o.decimal};})};});
var h='<h1 class="ev-head__name">'+esc(ev.home)+' - '+esc(ev.away)+'</h1><p class="cs-meta">'+esc(ev.league)+' · '+hhmm(ev.kickoff)+'</p>';
h+='<div class="ev-nav" role="tablist"><button type="button" role="tab" data-g="main" aria-selected="true">Principal</button><button type="button" role="tab" data-g="goals">Buts</button><button type="button" role="tab" data-g="corners">Corners</button><button type="button" role="tab" data-g="specials">Spéciaux</button></div><div id="markets">';
mk.forEach(function(m){h+='<section class="ev-group" data-g="'+m.group+'"'+(m.group==='main'?'':' hidden')+'><h3 class="ev-group__label">'+esc(m.name)+'</h3>';m.sel.forEach(function(s){var lab=s.label+(m.line!=null?' '+m.line.toFixed(1):'');h+='<div class="ev-choice"><span class="ev-choice__name">'+esc(lab)+'</span> <button type="button" class="ev-choice__value">'+s.price.toFixed(2)+'</button></div>';});h+='</section>';});
h+='</div>';document.getElementById('event').innerHTML=h;
document.querySelectorAll('[role=tab]').forEach(function(b){b.addEventListener('click',function(){var g=b.getAttribute('data-g');document.querySelectorAll('[role=tab]').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false');});document.querySelectorAll('section[data-g]').forEach(function(s){if(s.getAttribute('data-g')===g)s.removeAttribute('hidden');else s.setAttribute('hidden','');});});});
document.querySelectorAll('.ev-choice__value').forEach(function(b){b.addEventListener('click',function(){window.betClicked=true;});});};
window.betClicked=false;</script>
<script>(async function(){try{var r=await fetch('/api/v2/auth/token',{headers:{accept:'application/json'}});if(r.status===401){document.body.setAttribute('data-expired','1');return;}var t=(await r.json()).token;try{localStorage.setItem('token',t);}catch(e){}var b=await (await fetch('/api/v2/account/balance',{headers:{authorization:'Bearer '+t,accept:'application/json'}})).json();document.getElementById('cs-balance').textContent='Solde : '+b.balance.toFixed(2).replace('.',',')+' € · Compte '+b.accountNumber;if(window.__ready)await window.__ready(t);}catch(e){document.body.setAttribute('data-error',String(e));}})();</script>
<script>(function(){var b=document.getElementById('cookie-banner');if(!b)return;if(document.cookie.indexOf('consent=1')>=0){b.remove();return;}var o=document.getElementById('cookie-ok');if(o)o.addEventListener('click',function(){document.cookie='consent=1; path=/';b.remove();});})();</script>
</body></html>
