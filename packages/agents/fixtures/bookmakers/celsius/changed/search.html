<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Celsius — Recherche</title><script src="https://sb2frontend-altenar2.biahosted.com/altenarWSDK.js" async></script>
<style>body{font-family:sans-serif;margin:0;padding:12px}a{color:#036}[hidden]{display:none!important}section,article{margin:8px 0}</style></head>
<body>
<header class="cs-top"><a href="/" class="cs-logo">Celsius</a> <span id="cs-balance"></span> <a href="/cashier/deposit" class="cs-deposit">Dépôt</a></header>
<div id="cookie-banner" class="cs-cookies">Ce site utilise des cookies. <button id="cookie-ok" type="button">Tout accepter</button></div>
<form action="/sports/search" method="get" class="cs-search"><input type="search" name="q" placeholder="Rechercher une équipe"></form>
<h1>Recherche</h1><div id="events">Chargement…</div>
<script>function hhmm(iso){var d=new Date(Date.parse(iso)+3600000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderList(all){var by={};all.forEach(function(e){(by[e.league]=by[e.league]||[]).push(e);});var h='';Object.keys(by).forEach(function(l){h+='<section class="ev-comp"><h2 class="ev-comp__label">'+esc(l)+'</h2>';by[l].forEach(function(e){h+='<a class="ev-line" href="/sports/football/event/'+e.id+'"><span class="ev-line__p1">'+esc(e.home)+'</span> - <span class="ev-line__p2">'+esc(e.away)+'</span> <time class="ev-line__start" datetime="'+e.kickoff+'">'+hhmm(e.kickoff)+'</time> <span class="cs-more">+'+e.n+'</span></a>';});h+='</section>';});document.getElementById('events').innerHTML=h||'<p>Aucun match.</p>';}
window.__ready=async function(t){var q=new URLSearchParams(location.search).get('q')||'';var r=await fetch('/api/v2/search?q='+encodeURIComponent(q),{headers:{authorization:'Bearer '+t,accept:'application/json'}});var j=await r.json();renderList(j.results);};</script>
<script>(async function(){try{var r=await fetch('/api/v2/auth/token',{headers:{accept:'application/json'}});if(r.status===401){document.body.setAttribute('data-expired','1');return;}var t=(await r.json()).token;try{localStorage.setItem('token',t);}catch(e){}var b=await (await fetch('/api/v2/account/balance',{headers:{authorization:'Bearer '+t,accept:'application/json'}})).json();document.getElementById('cs-balance').textContent='Solde : '+b.balance.toFixed(2).replace('.',',')+' € · Compte '+b.accountNumber;if(window.__ready)await window.__ready(t);}catch(e){document.body.setAttribute('data-error',String(e));}})();</script>
<script>(function(){var b=document.getElementById('cookie-banner');if(!b)return;if(document.cookie.indexOf('consent=1')>=0){b.remove();return;}var o=document.getElementById('cookie-ok');if(o)o.addEventListener('click',function(){document.cookie='consent=1; path=/';b.remove();});})();</script>
</body></html>
